<div class="container mt-5">
  <div class="card p-4 shadow-lg" style="max-width: 400px; margin: auto;">
    <h3 class="text-center mb-4 text-primary">Login</h3>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
      
      <div class="text-center mt-3">
  <small>Don't have an account? 
    <a routerLink="/register" class="text-primary" style="cursor: pointer; text-decoration: underline;">
      Register here
    </a>
  </small>
</div>
    </form>
  </div>
</div>
