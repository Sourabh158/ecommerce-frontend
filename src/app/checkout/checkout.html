<div class="container mt-5 mb-5">
  <div class="row">
    
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3">
          <h4 class="mb-0">Shipping Details 📝</h4>
        </div>
        <div class="card-body p-4">
          <form (ngSubmit)="placeOrder()">
            
            <div class="mb-3">
              <label class="form-label fw-bold">Street Address</label>
              <input type="text" class="form-control" [(ngModel)]="checkoutData.street" name="street" required placeholder="House No, Building, Area">
            </div>

            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label fw-bold">City</label>
                <input type="text" class="form-control" [(ngModel)]="checkoutData.city" name="city" required placeholder="City Name">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">State</label>
                <input type="text" class="form-control" [(ngModel)]="checkoutData.state" name="state" required placeholder="State">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">Pincode</label>
                <input type="text" class="form-control" [(ngModel)]="checkoutData.pincode" name="pincode" required placeholder="6-digit code">
              </div>
            </div>

            <h5 class="mt-4 border-bottom pb-2">Payment Method 💳</h5>
            
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" [(ngModel)]="checkoutData.paymentMethod" value="ONLINE">
              <label class="form-check-label">Online Payment (Razorpay/UPI/Cards) 🚀</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" [(ngModel)]="checkoutData.paymentMethod" value="COD">
              <label class="form-check-label">Cash on Delivery (COD)</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4 py-3 text-uppercase fw-bold rounded-pill shadow">
              Place Order & Pay ₹{{ grandTotal }} ✅
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-light">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Order Summary 📦</h4>
          
          <ul class="list-group list-group-flush mb-3" *ngIf="cart">
            <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-bottom px-0 py-3" *ngFor="let item of cart.cartItems">
              <div>
                <h6 class="my-0 fw-bold text-dark">{{ item.product.productName }}</h6>
                <small class="text-muted">Quantity: {{ item.quantity }}</small>
              </div>
              <span class="fw-bold">₹{{ item.product.specialPrice * item.quantity }}</span>
            </li>
            
            <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0 py-3">
              <span class="h5 mb-0">Total Amount</span>
              <strong class="h4 mb-0 text-primary">₹{{ grandTotal }}</strong>
            </li>
          </ul>

          <div *ngIf="!cart" class="text-center py-4">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">Fetching your cart...</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
