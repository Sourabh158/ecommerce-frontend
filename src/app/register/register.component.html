<div class="container mt-5">
  <div class="card p-4 shadow-lg" style="max-width: 400px; margin: auto;">
    <h3 class="text-center mb-4 text-success">Create Account</h3>
    <form (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label>Full Name</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Sign Up</button>
    </form>
    <div class="text-center mt-3">
      <small>Already have an account? <a routerLink="/login">Login here</a></small>
    </div>
  </div>
</div>
